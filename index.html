<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Referto completo</title>
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
         background: #f4f6f5; color: #1d2a24; font-family: Helvetica, Arial, sans-serif; }
  main { max-width: 360px; padding: 32px 20px; text-align: center; }
  .h { font-size: 12px; letter-spacing: .08em; color: #5b6b63; }
  h1 { font-size: 22px; margin: 10px 0 6px; }
  p { font-size: 14px; color: #44524b; margin: 0 0 22px; }
  a.btn { display: inline-block; padding: 14px 26px; border-radius: 8px; background: #1f7a3c; color: #fff;
          text-decoration: none; font-weight: bold; font-size: 16px; }
  .bar { height: 4px; background: #d7e1db; border-radius: 2px; overflow: hidden; margin: 0 0 22px; }
  .bar i { display: block; height: 100%; width: 40%; background: #1f7a3c; animation: m 1.2s infinite ease-in-out; }
  @keyframes m { 0% { margin-left: -40%; } 100% { margin-left: 100%; } }
</style>
</head>
<body>
<main>
  <div class="h">A.O. SANTA MARIA DEGLI EVASI</div>
  <h1>Referto completo</h1>
  <p>Paziente DI MARZO CRISTIAN &middot; Ricovero n. 2026/1031-0666<br>Apertura del referto video in corso&hellip;</p>
  <div class="bar"><i></i></div>
  <a class="btn" id="open" href="https://www.youtube.com/watch?v=dQw4w9WgXcQ">Apri il referto</a>
</main>
<script>
  // Opens the YouTube app when installed, the website otherwise.
  var id = "dQw4w9WgXcQ";
  var web = "https://www.youtube.com/watch?v=" + id;
  var ua = navigator.userAgent || "";
  var target = web;
  if (/Android/i.test(ua)) {
    target = "intent://www.youtube.com/watch?v=" + id +
      "#Intent;scheme=https;package=com.google.android.youtube;S.browser_fallback_url=" +
      encodeURIComponent(web) + ";end";
  } else if (/iPhone|iPad|iPod/i.test(ua)) {
    target = "youtube://www.youtube.com/watch?v=" + id;
    setTimeout(function () { if (!document.hidden) location.href = web; }, 1800);
  }
  document.getElementById("open").href = target;
  location.href = target;
</script>
</body>
</html>
