<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Referto completo</title>
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
         background: #f4f6f5; color: #1d2a24; font-family: Helvetica, Arial, sans-serif; }
  main { width: 100%; max-width: 420px; padding: 28px 16px; text-align: center; box-sizing: border-box; }
  .h { font-size: 12px; letter-spacing: .08em; color: #5b6b63; }
  h1 { font-size: 22px; margin: 10px 0 6px; }
  p { font-size: 14px; color: #44524b; margin: 0 0 22px; }
  button { padding: 14px 26px; border: 0; border-radius: 8px; background: #1f7a3c; color: #fff;
           font-weight: bold; font-size: 16px; }
  #wrap { display: none; position: relative; width: 100%; padding-top: 56.25%; background: #000; border-radius: 8px;
          overflow: hidden; }
  #wrap > * { position: absolute; inset: 0; width: 100%; height: 100%; }
  small a { color: #5b6b63; }
</style>
</head>
<body>
<main>
  <div class="h">A.O. SANTA MARIA DEGLI EVASI</div>
  <h1>Referto completo</h1>
  <p id="info">Paziente DI MARZO CRISTIAN &middot; Ricovero n. 2026/1031-0666<br>Referto video disponibile. Alzare il volume prima dell'apertura.</p>
  <button id="open">Apri il referto</button>
  <div id="wrap"><div id="player"></div></div>
  <p style="margin-top:18px"><small><a href="https://www.youtube.com/watch?v=dQw4w9WgXcQ">Non si apre? Visualizza su YouTube</a></small></p>
</main>
<script src="https://www.youtube.com/iframe_api"></script>
<script>
  // The video plays inside the page, started by the tap on the button: a user tap is what lets a mobile
  // browser play it with sound. Opening the YouTube app from a web page failed on Brave and Chrome
  // (tested on Samuel's Android, 2026-10-30), so the page does not try any more.
  var player, ready = false;
  function onYouTubeIframeAPIReady() {
    player = new YT.Player("player", {
      videoId: "dQw4w9WgXcQ",
      playerVars: { playsinline: 1, rel: 0, controls: 1 },
      events: { onReady: function () { ready = true; } }
    });
  }
  document.getElementById("open").addEventListener("click", function () {
    document.getElementById("wrap").style.display = "block";
    this.style.display = "none";
    document.getElementById("info").innerHTML = "Riproduzione del referto in corso.<br>Se non parte, toccare il video.";
    if (ready) { player.unMute(); player.setVolume(100); player.playVideo(); }
  });
</script>
</body>
</html>
